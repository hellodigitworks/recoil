[build]
  publish = "."
  functions = "netlify/functions"

[build.environment]
  # whoop.js uses global fetch and AbortSignal.timeout.
  NODE_VERSION = "22"

[functions]
  node_bundler = "esbuild"

[[headers]]
  for = "/fonts/*"
  [headers.values]
    Cache-Control = "public, max-age=31536000, immutable"

# Netlify serves .webmanifest as octet-stream, which browsers may refuse,
# taking add-to-home-screen with it.
[[headers]]
  for = "/site.webmanifest"
  [headers.values]
    Content-Type = "application/manifest+json; charset=utf-8"

[[headers]]
  for = "/src/*/*"
  [headers.values]
    Cache-Control = "public, max-age=0, must-revalidate"

# Icon URLs carry a ?v= that changes whenever the mark does, so they can be
# cached hard.
[[headers]]
  for = "/icons/*"
  [headers.values]
    Cache-Control = "public, max-age=31536000, immutable"

# Static files win over this; it only catches app routes like /callback.
[[redirects]]
  from = "/*"
  to = "/index.html"
  status = 200
